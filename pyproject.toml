[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eurotender"
version = "0.1.0"
description = "Multilingual CPV classification for European public procurement notices (TED)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Since AI ry", email = "info@sinceai.fi" }]
requires-python = ">=3.10"
keywords = ["procurement", "tenders", "CPV", "TED", "text-classification", "multilingual", "eu"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "safetensors>=0.4",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
train = ["pandas>=2.0", "pyarrow>=14", "requests>=2.31"]
dev = [
  "eurotender[train]",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests",
  "pandas-stubs",
  "build>=1.2",
  "pip-audit>=2.7",
]

[project.scripts]
eurotender = "eurotender.cli:main"

[project.urls]
Homepage = "https://github.com/sinceaihq/eurotender"
Repository = "https://github.com/sinceaihq/eurotender"
Issues = "https://github.com/sinceaihq/eurotender/issues"
Model = "https://huggingface.co/sinceaihq/eurotender-cpv-baseline"
Dataset = "https://huggingface.co/datasets/sinceaihq/eurotender-cpv"

[tool.hatch.build.targets.wheel]
packages = ["src/eurotender"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]
"src/eurotender/text.py" = ["S105"]  # placeholder tokens, not passwords
"scripts/render_cards.py" = ["E501"]  # Markdown templates

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/eurotender"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "safetensors.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: needs internet access (Hugging Face Hub / TED API)",
  "slow: long-running tests",
]
